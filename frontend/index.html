<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LockByte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script defer src="renderer.js"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            background: #1e1e1e;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
        }
        .otp-box {
            font-size: 24px;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            background: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🔐 LockByte</h2>

    <h4>Accounts</h4>
    <ul id="accountList" class="list-group mb-3"></ul>

    <div class="otp-box">
        OTP: <span id="otp">-</span>
    </div>
    <p id="timer">Next update: 30s</p>
</div>
</body>

</html>
